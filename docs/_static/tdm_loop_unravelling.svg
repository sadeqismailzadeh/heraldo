<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" width="100%" height="100%">
  <defs>
    <style>
      .math-text { font-family: Cambria, "Times New Roman", Georgia, serif; font-style: italic; font-size: 16px; fill: #0f172a; }
      .math-bold { font-family: Cambria, "Times New Roman", Georgia, serif; font-weight: bold; font-size: 16px; fill: #0f172a; }
      .title-label { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: bold; fill: #1e293b; }
      .line-main { stroke: #1e293b; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .line-dotted { stroke: #64748b; stroke-width: 2; stroke-dasharray: 3,4; fill: none; }
      .bs-bar { fill: #1e293b; stroke: #0f172a; stroke-width: 1.5; }
      .bs-box { fill: #ffffff; stroke: #1e293b; stroke-width: 2; rx: 3; }
      .pulse-shape { fill: stroke; stroke: #1e293b; stroke-width: 2; fill: none; }
      .panel-bg { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; rx: 8; }
    </style>

    <!-- Arrowhead markers -->
    <marker id="arrow-right" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b"/>
    </marker>
    <marker id="arrow-left" viewBox="0 0 10 10" refX="4" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 10 1 L 0 5 L 10 9 z" fill="#1e293b"/>
    </marker>
  </defs>

  <!-- ==================================================================== -->
  <!-- PANEL A: FIBER LOOP TIME-DOMAIN MULTIPLEXING                         -->
  <!-- ==================================================================== -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="800" height="200" class="panel-bg" />
    <text x="20" y="30" class="title-label">(a)</text>

    <!-- Main Fiber Line -->
    <line x1="120" y1="120" x2="580" y2="120" class="line-main" marker-end="url(#arrow-right)" />

    <!-- Pulse 1 -->
    <path d="M 310,120 Q 320,95 330,120" class="pulse-shape" />
    <text x="320" y="88" class="math-text" text-anchor="middle">1</text>

    <!-- Pulse 2 -->
    <path d="M 230,120 Q 240,95 250,120" class="pulse-shape" />
    <text x="240" y="88" class="math-text" text-anchor="middle">2</text>

    <!-- Dots between pulses -->
    <text x="190" y="95" class="math-text" text-anchor="middle" style="font-size: 20px;">···</text>

    <!-- Pulse n -->
    <path d="M 130,120 Q 140,95 150,120" class="pulse-shape" />
    <text x="140" y="88" class="math-text" text-anchor="middle">n</text>

    <!-- Time interval tau arrow between Pulse 1 and Pulse 2 -->
    <line x1="245" y1="138" x2="315" y2="138" class="line-main" style="stroke-width:1.5;" marker-start="url(#arrow-left)" marker-end="url(#arrow-right)" />
    <text x="280" y="158" class="math-text" text-anchor="middle">τ</text>

    <!-- Fiber Loop -->
    <!-- Loop circle attached to BS at x=410, y=120 -->
    <path d="M 410,108 A 42,42 0 1,1 411,108" class="line-main" />
    <!-- Loop Delay Label tau -->
    <text x="410" y="20" class="math-text" text-anchor="middle" style="font-size: 18px;">τ</text>

    <!-- Variable Beam Splitter Box UBS(t) -->
    <rect x="398" y="108" width="24" height="24" class="bs-box" />
    <text x="410" y="155" class="math-text" text-anchor="middle">U<tspan style="font-size:12px;" dy="4">BS</tspan><tspan dy="-4">(t)</tspan></text>
  </g>

  <!-- ==================================================================== -->
  <!-- PANEL B: UNRAVELED EQUIVALENT BEAM SPLITTER NETWORK                  -->
  <!-- ==================================================================== -->
  <g transform="translate(10, 225)">
    <rect x="0" y="0" width="800" height="245" class="panel-bg" />
    <text x="20" y="30" class="title-label">(b)</text>

    <!-- Inputs i = 1, 2, ..., n -->
    <text x="70" y="65" class="math-text">i = 1</text>
    <text x="70" y="115" class="math-text">i = 2</text>
    <text x="85" y="155" class="math-text" style="font-size:20px;">⋮</text>
    <text x="70" y="195" class="math-text">i = n</text>

    <!-- Mode i = 1 path -->
    <path d="M 120,65 L 180,65 L 210,85 L 240,65 L 560,65" class="line-main" marker-end="url(#arrow-right)" />

    <!-- Mode i = 2 path -->
    <path d="M 120,115 L 180,115 L 210,85 L 240,115 L 260,115 L 290,135 L 320,115 L 560,115" class="line-main" marker-end="url(#arrow-right)" />

    <!-- Mode i = n path -->
    <path d="M 120,195 L 360,195 L 390,175 L 420,195 L 440,195 L 470,215 L 500,195 L 560,195" class="line-main" marker-end="url(#arrow-right)" />

    <!-- Intermediate dotted connections -->
    <text x="285" y="155" class="math-text" style="font-size:20px;">⋱</text>
    <text x="365" y="155" class="math-text" style="font-size:20px;">⋰</text>

    <!-- Beam Splitter Bars (thick tilted bars) -->
    <!-- UBS(1) -->
    <rect x="195" y="81" width="30" height="8" rx="2" class="bs-bar" transform="rotate(-25 210 85)" />
    <text x="210" y="50" class="math-text" text-anchor="middle">U<tspan style="font-size:12px;" dy="3">BS</tspan><tspan dy="-3">(1)</tspan></text>

    <!-- UBS(2) -->
    <rect x="275" y="131" width="30" height="8" rx="2" class="bs-bar" transform="rotate(-25 290 135)" />
    <text x="290" y="100" class="math-text" text-anchor="middle">U<tspan style="font-size:12px;" dy="3">BS</tspan><tspan dy="-3">(2)</tspan></text>

    <!-- UBS(n) -->
    <rect x="375" y="171" width="30" height="8" rx="2" class="bs-bar" transform="rotate(-25 390 175)" />
    <text x="390" y="155" class="math-text" text-anchor="middle">U<tspan style="font-size:12px;" dy="3">BS</tspan><tspan dy="-3">(n)</tspan></text>

    <!-- UBS(n+1) -->
    <rect x="455" y="211" width="30" height="8" rx="2" class="bs-bar" transform="rotate(-25 470 215)" />
    <text x="470" y="240" class="math-text" text-anchor="middle">U<tspan style="font-size:12px;" dy="3">BS</tspan><tspan dy="-3">(n+1)</tspan></text>

    <!-- Outputs j = 1, 2, ..., n -->
    <text x="585" y="65" class="math-text">j = 1</text>
    <text x="585" y="115" class="math-text">j = 2</text>
    <text x="600" y="155" class="math-text" style="font-size:20px;">⋮</text>
    <text x="585" y="195" class="math-text">j = n</text>
  </g>
</svg>