<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="100%" height="100%">
  <defs>
    <style>
      .bg-rect { fill: #ffffff; }
      .mode-line { stroke: #222222; stroke-width: 2.2; stroke-linecap: round; }
      .gate-box { stroke: #222222; stroke-width: 2; rx: 5px; ry: 5px; }
      .sq-box { fill: #fde8e8; }
      .disp-box { fill: #fdf0e6; }
      .bs-box { fill: #e8f8e8; }
      .pnrd-box { fill: #e8e8fd; stroke: #222222; stroke-width: 2; }
      .mode-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #555555; text-anchor: start; dominant-baseline: central; }
      .state-ket { font-family: "Latin Modern Math", "Cambria Math", "STIX Two Math", "Times New Roman", serif; font-size: 16px; fill: #111111; text-anchor: middle; dominant-baseline: central; }
      .gate-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #111111; text-anchor: middle; dominant-baseline: central; }
      .pnrd-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #111111; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg-rect" width="100%" height="100%" rx="8"/>

  <!-- Mode 0 Line -->
  <line class="mode-line" x1="105" y1="50" x2="705" y2="50" />

  <!-- Mode 1 Line -->
  <line class="mode-line" x1="105" y1="130" x2="620" y2="130" />

  <!-- Mode 2 Line -->
  <line class="mode-line" x1="105" y1="210" x2="620" y2="210" />

  <!-- Input Labels & Kets -->
  <!-- Mode 0 -->
  <text class="mode-label" x="15" y="50">Mode 0:</text>
  <text class="state-ket" x="80" y="50">|0⟩</text>

  <!-- Mode 1 -->
  <text class="mode-label" x="15" y="130">Mode 1:</text>
  <text class="state-ket" x="80" y="130">|0/1⟩</text>

  <!-- Mode 2 -->
  <text class="mode-label" x="15" y="210">Mode 2:</text>
  <text class="state-ket" x="80" y="210">|0/1⟩</text>

  <!-- Squeezing Gates (S0, S1, S2) -->
  <rect class="gate-box sq-box" x="138" y="32" width="44" height="36" />
  <text class="gate-text" x="160" y="50">S₀</text>

  <rect class="gate-box sq-box" x="138" y="112" width="44" height="36" />
  <text class="gate-text" x="160" y="130">S₁</text>

  <rect class="gate-box sq-box" x="138" y="192" width="44" height="36" />
  <text class="gate-text" x="160" y="210">S₂</text>

  <!-- Displacement Gates (D0, D1, D2) -->
  <rect class="gate-box disp-box" x="210" y="32" width="44" height="36" />
  <text class="gate-text" x="232" y="50">D₀</text>

  <rect class="gate-box disp-box" x="210" y="112" width="44" height="36" />
  <text class="gate-text" x="232" y="130">D₁</text>

  <rect class="gate-box disp-box" x="210" y="192" width="44" height="36" />
  <text class="gate-text" x="232" y="210">D₂</text>

  <!-- Beam Splitter 1 (BS1): spans modes 0 and 1 -->
  <rect class="gate-box bs-box" x="288" y="32" width="44" height="116" />
  <text class="gate-text" x="310" y="90">BS₁</text>

  <!-- Beam Splitter 2 (BS2): spans modes 1 and 2 -->
  <rect class="gate-box bs-box" x="388" y="112" width="44" height="116" />
  <text class="gate-text" x="410" y="170">BS₂</text>

  <!-- Beam Splitter 3 (BS3): spans modes 0 and 1 -->
  <rect class="gate-box bs-box" x="488" y="32" width="44" height="116" />
  <text class="gate-text" x="510" y="90">BS₃</text>

  <!-- PNRD Detectors -->
  <!-- Mode 1 Detector -->
  <path class="pnrd-box" d="M 620 112.5 H 648 A 17.5 17.5 0 0 1 648 147.5 H 620 Z" />
  <text class="pnrd-text" x="638" y="130">PNRD</text>

  <!-- Mode 2 Detector -->
  <path class="pnrd-box" d="M 620 192.5 H 648 A 17.5 17.5 0 0 1 648 227.5 H 620 Z" />
  <text class="pnrd-text" x="638" y="210">PNRD</text>

  <!-- Output State Mode 0 -->
  <text class="state-ket" x="725" y="50">|ψ⟩</text>
</svg>
