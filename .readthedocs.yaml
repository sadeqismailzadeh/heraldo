# .readthedocs.yaml
# Read the Docs configuration file using 'uv'
# See https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    post_create_environment:
      # Install 'uv' inside the Read the Docs environment
      - pip install uv
    install:
      # Tell uv to sync into Read the Docs' virtual environment using your docs dependency group
      - UV_PROJECT_ENVIRONMENT=$READTHEDOCS_VIRTUALENV_PATH uv sync --group docs

sphinx:
  configuration: docs/conf.py